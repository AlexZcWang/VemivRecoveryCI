# Public bridge workflow for AlexZcWang/ci-archive-runner.
#
# Public surface stays generic: bootstrap, secret refs, checkout, decrypt, run
# the private recipe with every stream redirected, then encrypt diagnostics
# before anything leaves the runner. All app-specific build, signing, test and
# upload logic lives in the encrypted source as scripts/run-bridge-testflight.sh.
#
# Nothing here prints source, compiler output, .xcresult content or signing
# material: those only ever exist inside $DIAGNOSTICS_DIR, which is encrypted
# with the existing AES-256-GCM layout ([12B IV][16B tag][ciphertext],
# key = sha256(passphrase)) before upload. The encryption step is self-contained
# so it cannot depend on a successful source decryption.
#
# Each release is dispatched against an immutable tag created for that upload,
# and the decrypted archive's own PAX commit id must equal source_commit before
# the private recipe is allowed to run.
name: Archive Build

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Required short sequential numeric build number.
        required: true
        type: string
      marketing_version:
        description: Marketing version, such as 1.1.1.
        required: true
        default: 1.1.1
        type: string
      source_commit:
        description: Immutable 40-character commit SHA of the private source.
        required: true
        type: string
      dry_run:
        description: Build and sign without uploading to App Store Connect.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Never cancel another run: a queued release waits for the active one instead
# of interrupting it.
concurrency:
  group: bridge-testflight-release
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    environment: Release

    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      PRODUCT_BUNDLE_IDENTIFIER: ${{ secrets.PRODUCT_BUNDLE_IDENTIFIER }}
      APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
      APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
      APPSTORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_CONNECT_PRIVATE_KEY_BASE64 }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      AI_BACKEND_URL: ${{ secrets.AI_BACKEND_URL }}
      AI_BACKEND_TOKEN: ${{ secrets.AI_BACKEND_TOKEN }}
      SOURCE_PASSPHRASE: ${{ secrets.SOURCE_PASSPHRASE }}
      XCODE_PROJECT: ${{ secrets.XCODE_PROJECT }}
      XCODE_SCHEME: ${{ secrets.XCODE_SCHEME }}
      INFO_PLIST_RELATIVE_PATH: ${{ secrets.INFO_PLIST_RELATIVE_PATH }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      MARKETING_VERSION: ${{ inputs.marketing_version }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      DRY_RUN: ${{ inputs.dry_run }}
      SOURCE_DIR: ${{ github.workspace }}/source
      # The diagnostics location is declared per step: the `runner` context is
      # not available in a job-level env block, and using it there makes the
      # whole workflow unparseable (GitHub rejects the dispatch with HTTP 422).

    steps:
      - name: Check out encrypted build recipe
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate inputs and required secrets
        env:
          DIAGNOSTICS_DIR: ${{ runner.temp }}/diagnostics
        run: |
          set -euo pipefail
          if ! printf '%s' "$SOURCE_COMMIT" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "source_commit must be a full 40-character commit SHA."
            exit 1
          fi
          : "${APPLE_TEAM_ID:?APPLE_TEAM_ID is required}"
          : "${PRODUCT_BUNDLE_IDENTIFIER:?PRODUCT_BUNDLE_IDENTIFIER is required}"
          : "${APPSTORE_CONNECT_ISSUER_ID:?APPSTORE_CONNECT_ISSUER_ID is required}"
          : "${APPSTORE_CONNECT_KEY_ID:?APPSTORE_CONNECT_KEY_ID is required}"
          : "${APPSTORE_CONNECT_PRIVATE_KEY_BASE64:?APPSTORE_CONNECT_PRIVATE_KEY_BASE64 is required}"
          : "${BUILD_CERTIFICATE_BASE64:?BUILD_CERTIFICATE_BASE64 is required}"
          : "${P12_PASSWORD:?P12_PASSWORD is required}"
          : "${KEYCHAIN_PASSWORD:?KEYCHAIN_PASSWORD is required}"
          : "${AI_BACKEND_URL:?AI_BACKEND_URL is required}"
          : "${AI_BACKEND_TOKEN:?AI_BACKEND_TOKEN is required}"
          : "${SOURCE_PASSPHRASE:?SOURCE_PASSPHRASE is required}"
          : "${XCODE_PROJECT:?XCODE_PROJECT is required}"
          : "${XCODE_SCHEME:?XCODE_SCHEME is required}"
          : "${INFO_PLIST_RELATIVE_PATH:?INFO_PLIST_RELATIVE_PATH is required}"
          mkdir -p "$DIAGNOSTICS_DIR"
          chmod 700 "$DIAGNOSTICS_DIR"
          echo "Inputs and secret names validated."

      - name: Decrypt source and verify archived commit
        env:
          DIAGNOSTICS_DIR: ${{ runner.temp }}/diagnostics
        run: |
          set -euo pipefail
          mkdir -p "$DIAGNOSTICS_DIR"
          {
            ENCRYPTED_SOURCE_PATH="$GITHUB_WORKSPACE/source.tar.gz.enc" \
            DECRYPTED_SOURCE_PATH="$RUNNER_TEMP/source.tar.gz" \
            node "$GITHUB_WORKSPACE/decrypt-source.mjs"

            # A git archive records the commit it was created from in its PAX
            # header. The tar is decompressed to a file first so the git command
            # reads it directly, without a pipe that pipefail could turn into a
            # SIGPIPE failure.
            gzip -dc "$RUNNER_TEMP/source.tar.gz" > "$RUNNER_TEMP/source.tar"
            ARCHIVED_COMMIT=$(git get-tar-commit-id < "$RUNNER_TEMP/source.tar" | tr 'A-F' 'a-f')
            EXPECTED_COMMIT=$(printf '%s' "$SOURCE_COMMIT" | tr 'A-F' 'a-f')
            if [ "$ARCHIVED_COMMIT" != "$EXPECTED_COMMIT" ]; then
              printf 'archived source commit does not match the requested source_commit\n'
              exit 1
            fi

            mkdir -p "$SOURCE_DIR"
            tar -xf "$RUNNER_TEMP/source.tar" -C "$SOURCE_DIR"
          } >"$DIAGNOSTICS_DIR/decrypt.log" 2>&1

      - name: Run private archive recipe
        env:
          DIAGNOSTICS_DIR: ${{ runner.temp }}/diagnostics
          PUBLIC_SUMMARY_PATH: ${{ runner.temp }}/public-summary.json
        run: |
          set -uo pipefail
          mkdir -p "$DIAGNOSTICS_DIR"
          if [ ! -f "$SOURCE_DIR/scripts/run-bridge-testflight.sh" ]; then
            echo "The encrypted source does not contain the archive recipe."
            exit 1
          fi
          bash "$SOURCE_DIR/scripts/run-bridge-testflight.sh" \
            >"$DIAGNOSTICS_DIR/recipe.log" 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "Archive recipe failed. Encrypted diagnostics are attached as an artifact."
            exit "$code"
          fi
          echo "Archive recipe completed: XCTest passed before archive and upload."

      - name: Upload upload-acceptance marker
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bridge-upload-accepted
          path: ${{ runner.temp }}/upload-accepted.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Report non-sensitive result
        if: ${{ success() }}
        run: |
          set -euo pipefail
          echo "Bridge archive run completed."
          echo "source_commit=${SOURCE_COMMIT}"
          echo "marketing_version=${MARKETING_VERSION}"
          echo "build_number=${BUILD_NUMBER}"
          echo "dry_run=${DRY_RUN}"

      - name: Encrypt diagnostics
        if: ${{ failure() }}
        env:
          DIAGNOSTICS_PASSPHRASE: ${{ secrets.SOURCE_PASSPHRASE }}
          DIAGNOSTICS_DIR: ${{ runner.temp }}/diagnostics
        run: |
          set -euo pipefail
          TAR_PATH="$RUNNER_TEMP/diagnostics.tar.gz"
          ENC_PATH="$RUNNER_TEMP/diagnostics.tar.gz.enc"
          # Only the diagnostics directory is packed: never $RUNNER_TEMP as a
          # whole, and never keys, profiles, archives or .xcresult bundles.
          tar -czf "$TAR_PATH" -C "$(dirname "$DIAGNOSTICS_DIR")" "$(basename "$DIAGNOSTICS_DIR")"
          node -e 'const crypto=require("node:crypto"),fs=require("node:fs");const src=process.argv[1],out=process.argv[2];const pass=process.env.DIAGNOSTICS_PASSPHRASE;if(!pass){throw new Error("diagnostics passphrase is required")};const key=crypto.createHash("sha256").update(pass,"utf8").digest();const iv=crypto.randomBytes(12);const cipher=crypto.createCipheriv("aes-256-gcm",key,iv);const ciphertext=Buffer.concat([cipher.update(fs.readFileSync(src)),cipher.final()]);fs.writeFileSync(out,Buffer.concat([iv,cipher.getAuthTag(),ciphertext]));' "$TAR_PATH" "$ENC_PATH"
          rm -f "$TAR_PATH"
          echo "Encrypted diagnostics prepared."

      - name: Upload encrypted diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bridge-diagnostics-encrypted
          path: ${{ runner.temp }}/diagnostics.tar.gz.enc
          if-no-files-found: error
          retention-days: 7

      - name: Upload non-sensitive summary
        if: ${{ success() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bridge-summary
          path: ${{ runner.temp }}/public-summary.json
          if-no-files-found: warn
          retention-days: 7

      - name: Clean up decrypted material
        if: ${{ always() }}
        run: |
          set -uo pipefail
          # The decrypted tree is removed only when its canonical path is
          # exactly $GITHUB_WORKSPACE/source.
          if [ -n "${SOURCE_DIR:-}" ] && [ -d "$SOURCE_DIR" ]; then
            RESOLVED_SOURCE="$(cd "$SOURCE_DIR" 2>/dev/null && pwd -P || true)"
            RESOLVED_EXPECTED="$(cd "${GITHUB_WORKSPACE:-}/source" 2>/dev/null && pwd -P || true)"
            if [ -n "$RESOLVED_SOURCE" ] && [ "$RESOLVED_SOURCE" = "$RESOLVED_EXPECTED" ]; then
              rm -rf "$RESOLVED_SOURCE"
            else
              echo "Refusing to remove an unexpected source tree."
            fi
          fi
          rm -rf "$RUNNER_TEMP/source.tar.gz" \
            "$RUNNER_TEMP/source.tar" \
            "$RUNNER_TEMP/TestDerivedData" \
            "$RUNNER_TEMP/Archive.xcarchive" \
            "$RUNNER_TEMP/export" 2>/dev/null || true
          security delete-keychain "$RUNNER_TEMP/archive-signing.keychain-db" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/distribution.p12" \
            "$RUNNER_TEMP/ExportOptions.plist" \
            "$RUNNER_TEMP/profiles.json" \
            "$RUNNER_TEMP/profiles.env" 2>/dev/null || true
          echo "Cleanup finished."
